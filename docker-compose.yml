services:
  postgres:
    image: postgres:16-alpine
    container_name: serviclean_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: serviclean
    ports:
      - "5433:5432"
    volumes:
      - serviclean_postgres_data:/var/lib/postgresql/data

volumes:
  serviclean_postgres_data:
